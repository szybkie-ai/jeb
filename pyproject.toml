[project]
name = "jeb"
version = "0.1.0"
description = "System One-compatible decision API on top of open LLMs: state + typed questions in, calibrated probabilities out, one forward pass"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://www.szybkie.ai"
Repository = "https://github.com/szybkie-ai/jeb"

[project.optional-dependencies]
vllm = ["vllm>=0.10"]
evals = ["pandas>=2.0", "pyarrow>=15"]

[project.scripts]
jeb = "jeb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "typesafe-sdk>=0.6.0", "pandas>=2.0", "pyarrow>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jeb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
